services:
  db:
    image: pgvector/pgvector:pg16  # Postgres 16 with the pgvector extension pre-installed
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # keeps data across `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  # Runs the Alembic migrations once, then exits. The app services wait for it.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &app-env
      # Inside Docker's network, services reach each other by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://pulse:pulse@db:5432/pulse
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *app-env  # same env vars as `migrate` (YAML anchor)
    ports:
      - "8000:8000"
    depends_on: &app-deps
      # Wait until the healthchecks pass / migrations finish, not just until containers start.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Same image, different command: takes tasks off the Redis queue and runs them.
  worker:
    build: .
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    environment: *app-env
    depends_on: *app-deps

  # The clock. Exactly ONE beat must run, or every scheduled task is queued twice.
  beat:
    build: .
    command:
      ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info",
       "--schedule", "/tmp/celerybeat-schedule"]
    environment: *app-env
    depends_on: *app-deps

volumes:
  pgdata:
