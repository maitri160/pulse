services:
  db:
    image: pgvector/pgvector:pg16  # Postgres 16 with the pgvector extension pre-installed
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data  # keeps data across `docker compose down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      # Inside Docker's network, services reach each other by service name, not localhost.
      DATABASE_URL: postgresql+psycopg://pulse:pulse@db:5432/pulse
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      # Wait until the healthchecks pass, not just until the containers start.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
